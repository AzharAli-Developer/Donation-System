[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "donation-system"
version = "0.1.0"
description = "A Django application for coordinating donors, volunteers, and donation delivery workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=4.2,<5.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "django-stubs[compatible-mypy]>=5.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-django>=4.8",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["config", "donations"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["donations"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".venv",
    "migrations",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = [
    "DJ001",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.django-stubs]
django_settings_module = "config.settings"
